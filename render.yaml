services:
  # -----------------------------------------------------------------------------------------------
  # BACKEND SERVICE (Python / FastAPI)
  # -----------------------------------------------------------------------------------------------
  - type: web
    name: netmonitor-backend
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000

  # -----------------------------------------------------------------------------------------------
  # FRONTEND SERVICE (Static Site)
  # -----------------------------------------------------------------------------------------------
  # Using 'type: web' with 'env: static' is the most robust way to define static sites
  # if standard 'staticSites' block fails validation.
  - type: web
    name: netmonitor-frontend
    env: static
    region: ohio
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: netmonitor-backend
          property: url
